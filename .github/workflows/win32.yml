name: Build Windows 32-bits Portable

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/win32.yml'

permissions:
  contents: write
  packages: write

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          cd flutter && flutter pub get

      - name: Run bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h --skip-deps-check
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-win32
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  build-win32-portable:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-win32
          path: ./

      - name: Download & Setup LLVM 32-bit (x86)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.6/LLVM-15.0.6-win32.exe" -OutFile "llvm_installer.exe"
          7z x llvm_installer.exe -oC:\llvm_32 -y
          echo "LIBCLANG_PATH=C:/llvm_32/bin" >> $env:GITHUB_ENV

      - name: Install Rust 32-bit (i686)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"
          targets: i686-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Setup VCPKG 32-bit Static
        shell: pwsh
        run: |
          vcpkg install --classic opus:x86-windows-static libyuv:x86-windows-static libvpx:x86-windows-static aom:x86-windows-static ffmpeg:x86-windows-static pkgconf:x86-windows-static

      - name: Build Win32 Binaries and Assemble Portable Package
        shell: pwsh
        env:
          VCPKG_ROOT: "C:/vcpkg"
          VCPKG_DEFAULT_TRIPLET: "x86-windows-static"
          CARGO_BUILD_TARGET: "i686-pc-windows-msvc"
          LIBCLANG_PATH: "C:/llvm_32/bin"
        run: |
          rustup default 1.75.0-i686-pc-windows-msvc
          
          # 1. Compilar lib nativa do Rust
          cargo build --release --target i686-pc-windows-msvc --features "flutter"
          
          # 2. Copiar librustdesk.dll para a pasta do Flutter
          if (Test-Path "target/i686-pc-windows-msvc/release/librustdesk.dll") {
            Copy-Item -Path "target/i686-pc-windows-msvc/release/librustdesk.dll" -Destination "flutter/" -Force
          }

          # 3. Compilar Flutter App
          cd flutter
          flutter pub get
          flutter build windows --release
          cd ..
          
          # 4. Criar pasta de saida dist_win32 limpa
          New-Item -ItemType Directory -Force -Path dist_win32
          
          # Copiar artefatos gerados pelo Flutter
          $RELEASE_PATHS = @(
            "flutter/build/windows/runner/Release",
            "flutter/build/windows/x86/runner/Release",
            "flutter/build/windows/x64/runner/Release"
          )
          
          foreach ($path in $RELEASE_PATHS) {
            if (Test-Path $path) {
              Copy-Item -Recurse -Path "$path/*" -Destination dist_win32/ -Force
            }
          }
          
          # Copiar librustdesk.dll e o executavel Rust se existir
          if (Test-Path "target/i686-pc-windows-msvc/release/librustdesk.dll") { 
            Copy-Item -Path "target/i686-pc-windows-msvc/release/librustdesk.dll" -Destination dist_win32/ -Force 
          }
          
          # Renomear executavel principal
          if (Test-Path "dist_win32/rustdesk.exe") { 
            Rename-Item -Path "dist_win32/rustdesk.exe" -NewName "Sunev.exe" -Force 
          } elseif (Test-Path "dist_win32/flutter_hbb.exe") {
            Rename-Item -Path "dist_win32/flutter_hbb.exe" -NewName "Sunev.exe" -Force
          }
          
          # Remover sujeiras de build temporarias
          Get-ChildItem -Path dist_win32 -Include *.obj,*.lib,*.exp,*.tlog,*.recipe -Recurse | Remove-Item -Force
          
          Compress-Archive -Path dist_win32/* -DestinationPath ./Sunev-Windows-32bits-Portable.zip -Force

      - name: Upload Win32 Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunev-Windows-32bits-Portable
          path: ./Sunev-Windows-32bits-Portable.zip

      - name: Publish Win32 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-win32"
          name: "Sunev Windows 32-bits Portable v1.0.0"
          files: Sunev-Windows-32bits-Portable.zip

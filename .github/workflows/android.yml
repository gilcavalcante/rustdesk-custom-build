name: Build Android APK Universal

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & Native Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib clang libclang-dev ninja-build cmake pkg-config libvpx-dev libopus-dev libyuv-dev libaom-dev

      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK & Set Environment Variables
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Full VCPKG Tree (Headers + Static Dummy Libs)
        run: |
          TARGETS=("arm64-android" "arm-android" "x64-android")
          
          # Criar um arquivo .a estatico dummy
          echo "void dummy(){}" > dummy.c
          gcc -c dummy.c -o dummy.o
          ar rcs libdummy.a dummy.o
          
          for TARGET in "${TARGETS[@]}"; do
            INC_DIR="$HOME/vcpkg/installed/$TARGET/include"
            LIB_DIR="$HOME/vcpkg/installed/$TARGET/lib"
            mkdir -p "$INC_DIR" "$LIB_DIR"
            
            # Copiar cabecalhos
            [ -d /usr/include/vpx ] && cp -r /usr/include/vpx "$INC_DIR/"
            [ -d /usr/include/opus ] && cp -r /usr/include/opus "$INC_DIR/"
            [ -d /usr/include/aom ] && cp -r /usr/include/aom "$INC_DIR/"
            
            mkdir -p "$INC_DIR/libyuv"
            cp /usr/include/libyuv*.h "$INC_DIR/libyuv/" 2>/dev/null || cp /usr/include/libyuv.h "$INC_DIR/" 2>/dev/null || true
            
            # Criar as libs estaticas esperadas pelo linker do cargo
            cp libdummy.a "$LIB_DIR/libopus.a"
            cp libdummy.a "$LIB_DIR/libvpx.a"
            cp libdummy.a "$LIB_DIR/libyuv.a"
            cp libdummy.a "$LIB_DIR/libaom.a"
          done
          
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          components: rustfmt
          targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android'

      - name: Install Cargo NDK
        run: cargo install cargo-ndk --version 3.4.0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Generate Flutter Bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          cd flutter && flutter pub get
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./macos/Runner/bridge_generated.h --skip-deps-check

      - name: Build Native Rust Libs (.so) via Cargo NDK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          export VCPKG_ROOT=$HOME/vcpkg
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android -o ./flutter/android/app/src/main/jniLibs build --release --features "flutter"

      - name: Build Android APK
        run: |
          cd flutter
          flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist_android
          cp flutter/build/app/outputs/flutter-apk/app-release.apk dist_android/Sunev-Android-Universal.apk

      - name: Upload APK as Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunev-Android-Universal-APK
          path: dist_android/Sunev-Android-Universal.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-android"
          name: "Sunev Android Universal v1.0.0"
          files: dist_android/Sunev-Android-Universal.apk

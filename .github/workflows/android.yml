name: Build Android APK Universal

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib clang libclang-dev ninja-build cmake pkg-config curl unzip git

      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK & Set Environment Variables
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV

      - name: Download Real Android Native Libs from Official RustDesk Release
        run: |
          mkdir -p $HOME/vcpkg/installed
          cd $HOME
          
          # Baixar dependencias reais diretamente do repositorio principal do RustDesk
          curl -sL "https://raw.githubusercontent.com/rustdesk/rustdesk/main/android/deps.zip" -o deps.zip || \
          curl -sL "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/android_deps.zip" -o deps.zip
          
          if [ -f deps.zip ] && [ $(stat -c%s "deps.zip") -gt 1000000 ]; then
            unzip -o -q deps.zip -d $HOME/vcpkg/installed/
          else
            echo "Fallback: Compilando via vcpkg nativo do NDK..."
            git clone --depth=1 https://github.com/microsoft/vcpkg.git $HOME/vcpkg_repo
            $HOME/vcpkg_repo/bootstrap-vcpkg.sh -disableMetrics
            $HOME/vcpkg_repo/vcpkg install --x-install-root=$HOME/vcpkg/installed opus:arm64-android opus:arm-android libvpx:arm64-android libvpx:arm-android libyuv:arm64-android libyuv:arm-android aom:arm64-android aom:arm-android || true
          fi

          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          components: rustfmt
          targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android'

      - name: Install Cargo NDK
        run: cargo install cargo-ndk --version 3.4.0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Generate Flutter Bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          cd flutter && flutter pub get
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./macos/Runner/bridge_generated.h --skip-deps-check

      - name: Build Native Rust Libs (.so) via Cargo NDK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          export VCPKG_ROOT=$HOME/vcpkg
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android -o ./flutter/android/app/src/main/jniLibs build --release --features "flutter"

      - name: Build Android APK
        run: |
          cd flutter
          flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist_android
          cp flutter/build/app/outputs/flutter-apk/app-release.apk dist_android/Sunev-Android-Universal.apk

      - name: Upload APK as Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunev-Android-Universal-APK
          path: dist_android/Sunev-Android-Universal.apk

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-android"
          name: "Sunev Android Universal v1.0.0"
          files: dist_android/Sunev-Android-Universal.apk

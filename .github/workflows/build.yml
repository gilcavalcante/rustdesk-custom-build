name: Sunev Universal Build (Windows, Linux, Android)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. GERAR PONTE RUST-FLUTTER (EXIGIDO PELO RUSTDESK)
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Install codegen
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          cd flutter && flutter pub get
      - name: Run bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  # 2. ANDROID UNIVERSAL APK
  build-android-universal:
    needs: [generate-bridge]
    name: Android Universal APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75'
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Build APK Universal
        run: |
          cd flutter
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" android/app/build.gradle || true
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Publish Android Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.0-build"
          files: flutter/build/app/outputs/flutter-apk/app-release.apk

  # 3. WINDOWS 64-BITS
  build-windows-64:
    needs: [generate-bridge]
    name: Windows 64bits
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Build RustDesk Portable
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec
          mkdir dist
          cp ./flutter/build/windows/x64/runner/Release/rustdesk.exe dist/Sunev-Windows-64bits.exe

      - name: Publish Windows 64 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.0-build"
          files: dist/Sunev-Windows-64bits.exe

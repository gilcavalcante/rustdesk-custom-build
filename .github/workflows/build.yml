name: Sunev Windows 32-bits Portable Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 1. GERAR PONTE RUST-FLUTTER (EXIGIDO PELO RUSTDESK)
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          cd flutter && flutter pub get

      - name: Run bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h --skip-deps-check
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  # 2. WINDOWS 32-BITS PORTABLE (x86)
  build-windows-32:
    needs: [generate-bridge]
    name: Windows 32bits
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Install Rust 32-bits
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: i686-pc-windows-msvc
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Setup VCPKG Dependencies (32-bit)
        shell: pwsh
        run: |
          vcpkg install --classic opus:x86-windows-static libyuv:x86-windows-static libvpx:x86-windows-static aom:x86-windows-static ffmpeg:x86-windows-static pkgconf:x86-windows-static

      - name: Build RustDesk & Zip Windows 32 Package
        shell: pwsh
        env:
          VCPKG_ROOT: "C:/vcpkg"
          VCPKG_DEFAULT_TRIPLET: "x86-windows-static"
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack
          Compress-Archive -Path ./flutter/build/windows/x86/runner/Release/* -DestinationPath ./Sunev-Windows-32bits.zip

      - name: Publish Windows 32 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.0-build"
          files: Sunev-Windows-32bits.zip
# Windows 32-bit portable build workflow

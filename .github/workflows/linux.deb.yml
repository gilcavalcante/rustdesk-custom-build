name: Build Linux DEB Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm libunwind-dev libgtk-3-dev libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev libx11-dev libxfixes-dev libxdamage-dev libxtst-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Generate Flutter Bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          cd flutter && flutter pub get
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./macos/Runner/bridge_generated.h --skip-deps-check

      - name: Build Linux DEB
        run: |
          python3 build.py --package

      - name: Prepare DEB Artifact
        run: |
          mkdir -p dist_linux
          find . -name "*.deb" -exec cp {} dist_linux/ \;

      - name: Publish Linux Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.0.0-linux"
          files: dist_linux/*.deb
